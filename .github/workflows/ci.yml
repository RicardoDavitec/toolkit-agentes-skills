name: ci-template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Lint do catalogo .cursor
        run: python3 scripts/lint_template.py
      - name: Tree-validate do payload exemplo F/S/P
        run: tools/glpi/bin/glpi-tree-validate --from .glpi/templates/tree-example.json --strict
