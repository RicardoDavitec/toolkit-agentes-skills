name: docs
on:
  pull_request:
    paths: ["docs/**", "scripts/docs/**", "**/schema.prisma"]
  push:
    branches: [main]
jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar documentos
        run: python scripts/docs/lint_docs.py
      - name: Instalar MkDocs
        run: pip install mkdocs-material
      - name: Construir portal
        run: mkdocs build -f tools/docs/mkdocs.yml --strict
