name: ci-template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-template:
    name: Catalogo .cursor, conflitos e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Lint do template
        run: python3 scripts/lint_template.py

  lint-docs:
    name: Documentacao (padrao 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint da documentacao
        if: ${{ hashFiles('scripts/docs/lint_docs.py') != '' }}
        run: python3 scripts/docs/lint_docs.py

  scripts:
    name: Sintaxe dos scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compila
        run: python3 -m compileall -q scripts tools
      - name: Shell sem erro de sintaxe
        run: |
          set -e
          for f in $(git ls-files 'scripts/*.sh' 'scripts/**/*.sh'); do
            bash -n "$f"
          done
